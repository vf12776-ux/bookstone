<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bookstone Гид</title>
    
    <!-- PWA настройки -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <!-- Стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <!-- Логотип или название -->
            <h1 class="brand-name">BOOKSTONE</h1>
            <p class="subtitle">Навигация по сервисам</p>
        </header>

        <main class="button-grid">
            <!-- 1. Магазин -->
            <a href="https://bookstone.me/shop" class="btn btn-primary">
                <span class="icon">🛍️</span>
                <span class="text">Магазин</span>
            </a>

            <!-- 2. Доставка и оплата -->
            <a href="https://bookstone.me/delivery-and-payment" class="btn">
                <span class="icon">🚚</span>
                <span class="text">Доставка и оплата</span>
            </a>

            <!-- 3. Позвонить (Группа кнопок) -->
            <div class="phone-group">
                <a href="tel:+79911321320" class="btn btn-outline">
                    <span class="icon">📞</span>
                    <span class="text">+7 (991) 132-13-20</span>
                </a>
                <a href="tel:+79162597488" class="btn btn-outline">
                    <span class="icon">📞</span>
                    <span class="text">+7 (916) 259-74-88</span>
                </a>
            </div>

            <!-- 4. Instagram -->
            <a href="https://www.instagram.com/bookstone.me/" target="_blank" class="btn btn-social insta">
                <span class="icon">📸</span>
                <span class="text">Instagram</span>
            </a>

            <!-- 5. Telegram -->
            <a href="https://t.me/bookstone_me" target="_blank" class="btn btn-social tg">
                <span class="icon">✈️</span>
                <span class="text">Telegram</span>
            </a>
        </main>

        <footer>
            <p>&copy; 2026 Bookstone</p>
        </footer>
    </div>

    <!-- Регистрация Service Worker -->
    <script src="app.js"></script>
</body>
</html>
